# ===============================
# DATASOURCE
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sangabriel_db_rrhh}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:jenner25}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=${JPA_SHOW_SQL:true}

spring.jpa.properties.hibernate.format_sql=true

spring.transaction.default-timeout=${TX_TIMEOUT:30}

# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true

spring.flyway.validate-on-migrate=false

# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration=900000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:rrhh.sangabrielhospital@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
# ===============================
# MULTIPART (subida de evidencias)
# ===============================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# MVC
# ===============================

spring.mvc.async.request-timeout=${MVC_TIMEOUT:30000}

# ===============================
# JACKSON
# ===============================

spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# CONFIGURACION DEL SISTEMA
# ===============================

sistema.nombre-empresa=SAN GABRIEL S.A.C.
sistema.max-intentos-login=3
sistema.zona-horaria=America/Lima

# ===============================
# NEGOCIO
# ===============================

rrhh.salario-minimo=1130.00

# ===============================
# NOMINA
# ===============================

rrhh.tasa-hora-extra1-5=1.5
rrhh.tasa-hora-extra2-0=2.0
rrhh.umbral-horas-dobles=2
# Asignación familiar: 10% de la RMV, una sola vez si existe al menos un hijo elegible.
rrhh.rmv=1130.00
rrhh.bonif-familiar=0.10
rrhh.bonif-nocturno=0.15
rrhh.bonif-guardia=50.00
rrhh.bonif-riesgo=0.10
rrhh.bonif-cargo=0.20
rrhh.tasa-descuento-ley=0.13
rrhh.tasa-descuento-afp=0.12

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# FRONTEND URL
# ===============================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.upload-dir=${UPLOAD_DIR:uploads/evidencias}

# ===============================
# AZURE BLOB STORAGE
# En local dejar vacío → usa disco
# En Azure poner la connection string real
# ===============================
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER:evidencias}
