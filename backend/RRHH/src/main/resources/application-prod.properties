# ===============================
# PRODUCCION - AZURE
# Todas las variables deben estar
# configuradas en App Service > Settings > Configuration
# ===============================

# Base de datos (Azure Database for PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=900000

# Mail
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Frontend (Azure Static Web Apps URL)
app.frontend-url=${FRONTEND_URL}

# App movil (APK vigente para enviar por correo)
app.mobile.download-url=${APP_MOBILE_DOWNLOAD_URL:https://drive.google.com/uc?export=download&id=1YzmCYq-r6BI3lXNtgYkcqp2wgeY3dIuA}

# Archivos (Azure Blob Storage path o volumen persistente)
app.upload-dir=${UPLOAD_DIR:/home/uploads/evidencias}

# Azure Blob Storage (evidencias de justificaciones)
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER:evidencias}

# Cookie - HTTPS cross-site para Azure
cookie.secure=true
cookie.same-site=None

# JPA - sin logs en produccion
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.validate-on-migrate=true
